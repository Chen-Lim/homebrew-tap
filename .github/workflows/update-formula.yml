name: Update AHR Formula

on:
  repository_dispatch:
    types: [ahr-release]

permissions:
  contents: write

jobs:
  update-formula:
    name: Update ahr formula
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate dispatch payload
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          version="${{ github.event.client_payload.version }}"
          sha256="${{ github.event.client_payload.binary_sha256 }}"

          if [[ -z "${version}" || -z "${sha256}" ]]; then
            echo "::error::Missing version or binary_sha256 in dispatch payload"
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${version}"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Update Formula/ahr.rb
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.validate.outputs.version }}"
          sha256="${{ steps.validate.outputs.sha256 }}"
          url="https://github.com/Chen-Lim/Apple-Health-Resonator-CLI/releases/download/v${version}/ahr-macos-arm64"

          sed -i "s|^  url \".*\"|  url \"${url}\"|" Formula/ahr.rb
          sed -i "s|^  version \".*\"|  version \"${version}\"|" Formula/ahr.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${sha256}\"|" Formula/ahr.rb

          echo "--- Updated Formula/ahr.rb ---"
          cat Formula/ahr.rb

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.validate.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ahr.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update ahr formula to v${version}"
          git push
